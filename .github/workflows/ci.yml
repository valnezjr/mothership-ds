name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    name: Tipos e build do styleguide
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm install --no-audit --no-fund

      - name: Checagem de tipos
        run: npm run typecheck

      - name: Build do styleguide
        run: npm run styleguide

      - name: Instalar dependências do exemplo Next.js
        working-directory: examples/next-app
        run: npm install --no-audit --no-fund

      - name: Build estático do exemplo Next.js
        working-directory: examples/next-app
        run: npm run build
        env:
          GITHUB_PAGES: "true"
