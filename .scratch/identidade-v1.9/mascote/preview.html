:root{--bounce:cubic-bezier(.34,1.56,.64,1)}
body{margin:0;font-family:system-ui;display:grid;gap:24px;padding:24px}
.row{display:flex;gap:24px;flex-wrap:wrap;padding:24px;border-radius:16px}
.dark{background:#0f0f1f;color:#fefefe}.darker{background:#05050b;color:#fefefe}.light{background:#f6f1e7;color:#191933}

.eye,.pupil,.breath,.z{transform-box:fill-box;transform-origin:center}
.m--piscando .eye{animation:blink 4s infinite}

.m--dormindo .breath{animation:breath 4.8s ease-in-out infinite}

.m--dormindo .z{animation:drift 4.8s linear infinite;opacity:0}
.m--dormindo .z2{animation-delay:1.6s}.m--dormindo .z3{animation-delay:3.2s}

.m--procurando .pupil{animation:look 3.6s infinite}
@keyframes look{0%,12%{transform:translate(0,0)}
 16%,40%{transform:translate(-125px,-35px);animation-timing-function:var(--bounce)}
 44%,68%{transform:translate(125px,-35px);animation-timing-function:var(--bounce)}
 72%,100%{transform:translate(0,0)}}
@media (prefers-reduced-motion:reduce){.m *{animation:none!important}.m--dormindo .z{opacity:1}}
